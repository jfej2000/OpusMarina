name: OpusMarina
options:
  bundleIdPrefix: com.joseespinosa
targets:
  OpusMarina:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Sources
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        # Background Modes declared in Info.plist (complementary to entitlements)
        UIBackgroundModes:
          - remote-notification
        NSMicrophoneUsageDescription: "OpusMarina necesita acceso al micrófono para grabar tus sesiones de práctica al piano."
    entitlements:
      path: OpusMarina.entitlements
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        DEVELOPMENT_TEAM: ""
        # Enable CloudKit capability in build settings
        ICLOUD_CONTAINER_ENVIRONMENT: Development
    # XcodeGen capabilities block for iCloud + CloudKit
    capabilities:
      iCloud:
        services:
          - cloudKit
        containers:
          - iCloud.com.joseespinosa.OpusMarina
      backgroundModes:
        modes:
          - remoteNotification
